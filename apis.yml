apis:
- aid: bitwarden:identity
  name: Bitwarden Identity API
  description: >-
    OAuth2 / OpenID Connect token endpoint that issues bearer tokens for the Public API and Vault Management
    API. Organization API keys use the client_credentials grant with scope api.organization; bearer tokens
    are valid for 3600 seconds.
  humanURL: https://bitwarden.com/help/public-api/
  baseURL: https://identity.bitwarden.com/connect/token
  tags:
  - Identity
  - Authentication
  tags_raw:
  - Identity
  - OAuth
  - Authentication
  properties:
  - type: Documentation
    url: https://bitwarden.com/help/public-api/
- aid: bitwarden:scim
  name: Bitwarden SCIM API
  description: >-
    SCIM 2.0 endpoint for directory-driven provisioning of users and groups (used by Okta, Entra ID, OneLogin,
    JumpCloud, Google Workspace via SCIM). Supports automatic invite, update, and offboard flows on Teams
    and Enterprise.
  humanURL: https://bitwarden.com/help/scim/
  baseURL: https://scim.bitwarden.com/v2
  tags:
  - SCIM
  - Provisioning
  - Identity
  properties:
  - type: Documentation
    url: https://bitwarden.com/help/scim/
- aid: bitwarden:vault-management
  name: Bitwarden Vault Management API
  description: >-
    Local Bitwarden CLI HTTP API for managing personal vault items, folders, sends, collections, organizations,
    the generator, and miscellaneous operations. Exposed by the bw CLI in serve mode and intended for
    local automation rather than remote access.
  humanURL: https://bitwarden.com/help/vault-management-api/
  baseURL: http://localhost:8087
  tags:
  - Vault Items
  - CLI
  - Local
  properties:
  - type: Documentation
    url: https://bitwarden.com/help/vault-management-api/
- aid: bitwarden:secrets-manager
  name: Bitwarden Secrets Manager API
  description: >-
    Secrets Manager API for storing and retrieving application secrets and managing projects, service
    accounts, secrets, and access tokens used by infrastructure and developer tooling.
  humanURL: https://bitwarden.com/help/secrets-manager-overview/
  baseURL: https://api.bitwarden.com
  tags:
  - Secrets Manager
  - Secrets
  - DevOps
  properties:
  - type: Documentation
    url: https://bitwarden.com/help/secrets-manager-overview/
