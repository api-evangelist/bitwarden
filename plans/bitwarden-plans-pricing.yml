description: >-
  Bitwarden offers consumer plans (Free, Premium $0.83/mo billed $9.99/yr, Families
  $3.33/mo billed $40/yr) and business plans (Teams $4/user/mo billed annually,
  Enterprise $6/user/mo billed annually). The Public API and SCIM endpoint are gated to
  the Teams and Enterprise tiers. Secrets Manager is sold as a separate add-on with its
  own user counts and machine-account allowance. Self-host is available on all tiers
  for organizations that prefer to operate Bitwarden on their own infrastructure.
sources:
  - https://bitwarden.com/pricing/
  - https://www.bitwarden.com/products/business/
  - https://bitwarden.com/help/public-api/
plans:
  - id: bitwarden-free
    name: Free
    type: freemium
    description: >-
      Personal Free plan. Unlimited devices, vault items, and core password management;
      no Public API access.
    entries:
      - label: Monthly Subscription
        name: subscription
        type: subscription
        metric: month
        limit: 1
        timeFrame: month
        unit: 1
        price: '$0'
        userMultiplied: false
      - label: API Access
        name: api_access
        type: flat
        metric: requests
        limit: 0
        timeFrame: month
        unit: 1
        price: not available
        userMultiplied: false
    elements:
      - name: Unlimited Devices and Vault Items
      - name: Bitwarden Send (Text)
      - name: Two-Step Login (App / Email)
      - name: Personal Vault Only
  - id: bitwarden-premium
    name: Premium
    type: subscription
    description: >-
      Personal Premium plan. $9.99/year (~$0.83/month). Adds integrated authenticator
      (TOTP), file attachments, emergency access, security reports, and YubiKey/FIDO2
      support. No Public API access.
    entries:
      - label: Annual Subscription
        name: subscription_annual
        type: subscription
        metric: year
        limit: 1
        timeFrame: year
        unit: 1
        price: '$9.99'
        userMultiplied: false
    elements:
      - name: Integrated Authenticator (TOTP)
      - name: File Attachments
      - name: Emergency Access
      - name: Security Reports
      - name: YubiKey / FIDO2 / Duo
  - id: bitwarden-families
    name: Families
    type: subscription
    description: >-
      Personal Families plan. $40/year for up to 6 users (~$3.33/month). Premium
      features for every member plus unlimited sharing through a single
      Families organization.
    entries:
      - label: Annual Subscription
        name: subscription_annual
        type: subscription
        metric: year
        limit: 1
        timeFrame: year
        unit: 1
        price: '$40'
        userMultiplied: false
      - label: Included Users
        name: users
        type: quota
        metric: user
        limit: 6
        timeFrame: year
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: 6 Premium Accounts
      - name: Unlimited Sharing and Collections
      - name: Organization Storage
  - id: bitwarden-teams
    name: Teams
    type: subscription
    description: >-
      Business Teams plan. $4/user/month billed annually. Adds the Public API, SCIM
      provisioning, directory connector, secure credential sharing, event logs, and
      groups.
    entries:
      - label: Subscription Per User (Annual)
        name: subscription_per_user_annual
        type: subscription
        metric: user_month
        limit: 1
        timeFrame: month
        unit: 1
        price: '$4'
        userMultiplied: true
      - label: API Access
        name: api_access
        type: included
        metric: requests
        limit: -1
        timeFrame: month
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Public API
      - name: SCIM Provisioning
      - name: Directory Connector
      - name: Event Logs
      - name: Groups and Collections
      - name: Secure Credential Sharing
  - id: bitwarden-enterprise
    name: Enterprise
    type: subscription
    description: >-
      Business Enterprise plan. $6/user/month billed annually. Adds enterprise policies,
      passwordless SSO, account recovery, self-hosting, Access Intelligence, complimentary
      Families plan for every member, and 24/7 priority support.
    entries:
      - label: Subscription Per User (Annual)
        name: subscription_per_user_annual
        type: subscription
        metric: user_month
        limit: 1
        timeFrame: month
        unit: 1
        price: '$6'
        userMultiplied: true
      - label: API Access
        name: api_access
        type: included
        metric: requests
        limit: -1
        timeFrame: month
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Public API and SCIM
      - name: Enterprise Policies
      - name: Passwordless SSO (SAML / OIDC)
      - name: Account Recovery
      - name: Self-Hosting Option
      - name: Access Intelligence
      - name: Complimentary Families Plan Per User
      - name: 24/7 Priority Support
  - id: bitwarden-secrets-manager
    name: Secrets Manager (Add-On)
    type: add-on
    description: >-
      Sold separately from the password-manager tiers. Free trial tier; Teams add-on
      typically $6/user/month and Enterprise typically $12/user/month, with included
      machine-account counts that scale by tier.
    entries:
      - label: Subscription Per User (Annual)
        name: subscription_per_user_annual
        type: subscription
        metric: user_month
        limit: 1
        timeFrame: month
        unit: 1
        price: tier-dependent
        userMultiplied: true
      - label: Machine Accounts
        name: machine_accounts
        type: quota
        metric: machine_account
        limit: tier-dependent
        timeFrame: month
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Project / Secret / Service Account Resources
      - name: SDK and CLI Access
      - name: GitHub Actions / Kubernetes Operators
